name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build-apk:
    name: Build AlphaScalp Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: |
          npm install

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Standalone APK with Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Locate & Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaScalp-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
